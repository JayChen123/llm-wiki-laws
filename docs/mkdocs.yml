site_name: 法律问答系统(llm-wiki)-v1
site_description: 法律知识问答系统（非 RAG / llm-wiki）八讲授课课件
site_author: Vincent(陈杰)
copyright: "法律知识问答系统 · 黑马研发"

# 文档源 = docs/课件，产物 = docs/site
docs_dir: 课件
site_dir: "法律问答系统(llm-wiki)-v1"

use_directory_urls: false

theme:
  name: material
  logo: img/logo.png
  #  favicon: img/logo1.png
  language: zh
  font: false                      # 不引 Google Fonts，用系统字体（本地/离线友好）
  #  icon:
  #    logo: material/scale-balance
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到浅色
  features:
    - navigation.sections
    #    - navigation.expand
    - navigation.prune
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.instant

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys


nav:
  - 课程首页:
      - 首页: 首页/index.md
  - 第一章 项目概述:
      - "第 1 讲 · RAG 的局限与 llm-wiki 理念": 第1章-项目概述/01-RAG的局限与llm-wiki理念.md
      - "第 2 讲 · 系统总览与工程环境": 第1章-项目概述/02-系统总览与工程环境.md
  - 第二章 知识库构建:
      - "第 3 讲 · 知识构建(一)：PDF → 205 个知识点": 第2章-知识库构建/03-知识构建一-PDF到205个知识点.md
      - "第 4 讲 · 知识构建(二)：概念增强/图谱/Wiki": 第2章-知识库构建/04-知识构建二-概念增强关联图谱与Wiki落盘.md
  - 第三章 检索问答流程:
      - "第 5 讲 · 查询(一)：BM25+向量双路召回与 RRF": 第3章-检索问答流程/05-查询一-BM25与向量双路召回与RRF融合.md
      - "第 6 讲 · 查询(二)：图谱多跳扩展与生成": 第3章-检索问答流程/06-查询二-图谱多跳扩展与qwen-max生成.md
  - 第四章 工程化开发:
      - "第 7 讲 · 短期记忆/CLI/结构化日志": 第4章-工程化开发/07-短期记忆CLI与结构化日志.md
  - 第五章 测试与评估:
      - "第 8 讲 · 评估与指标": 第5章-测试与评估/08-评估与指标.md

extra_javascript:
  - javascripts/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/header-logo.js

extra_css:
  - stylesheets/extra.css