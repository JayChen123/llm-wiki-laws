site_name: llm-wiki 法律知识问答系统-v2.0
site_description: 法律知识问答系统-llm-wiki-v2.0
site_author: Vincent(陈杰)
copyright: "法律知识问答系统 · 黑马研发"

# 文档源 = docs/课件，产物 = docs/site
docs_dir: 课件
site_dir: "法律问答系统(llm-wiki)"

use_directory_urls: false

theme:
  name: material
  logo: img/logo.png
  #  favicon: img/logo1.png
  language: zh
  font: false                      # 不引 Google Fonts，用系统字体（本地/离线友好）
  #  icon:
  #    logo: material/scale-balance
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到浅色
  features:
    - navigation.sections
    #    - navigation.expand
    - navigation.prune
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.instant

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys


