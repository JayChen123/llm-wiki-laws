# version: '3.5'

# Windows/x86_64 Version
# 所有账号密码集中在同目录的 .env（模板见 .env.example）

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_ENABLE_V2=true
    volumes:
      - ./volumes/etcd:/etcd/data
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd/data

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ./volumes/minio:/minio/data
    command: minio server /minio/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    # 使用多架构镜像，Docker on Windows 会自动拉取 x86_64 版本
    image: milvusdb/milvus:v2.4.4
    command: [ "milvus", "run", "standalone" ]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19532:19530"
      - "9092:9091"
    depends_on:
      - "etcd"
      - "minio"

#  redis:
#    container_name: milvus-redis
#    image: redis:7.2
#    restart: always
#    ports:
#      - "6380:6379"
#    volumes:
#      - ./volumes/redis:/data
#    # 密码见 docker/.env 的 REDIS_PASSWORD
#    command: redis-server --requirepass ${REDIS_PASSWORD}

  mysql:
    image: mysql:8.0.43
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    command: --local-infile=1
    volumes:
      - ./mysql_data:/var/lib/mysql

  # 图数据库：存放知识图谱（知识点节点 + 关联边），供图谱查询与遍历
  neo4j:
    image: neo4j:5.26.26
    container_name: neo4j-standalone
    environment:
      # 账号见 docker/.env（Neo4j 要求密码 ≥8 位）
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      # 内存给保守值，避免与 Milvus / MySQL 抢资源
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # Neo4j Browser：http://localhost:7474
      - "7687:7687"   # Bolt 协议（Python 驱动连这个）
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  default:
    name: milvus-network